name: Grav Visual Editor
slug: visual-editor
type: plugin
version: 2.2.0
description: A Markdown-preserving visual editor for Grav Admin2 with tables, alerts, media and shortcode support.
icon: edit
author:
  name: Enkirche
  email: dave@enkirche.fr
  homepage: https://github.com/manubarnum/grav-plugin-visual-editor
keywords: [editor, markdown, wysiwym, admin, blocks, tiptap]
license: MIT
dependencies:
  - { name: grav, version: '>=2.2.18' }
  - { name: api, version: '>=1.1.14' }
  - { name: admin2, version: '>=2.2.0' }
form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        general:
          type: tab
          title: Visual Editor
          fields:
            enabled:
              type: toggle
              label: Enable plugin
              default: 1
              options: { 1: Enabled, 0: Disabled }
            site_default:
              type: toggle
              label: Default content editor for the whole site
              help: 'Users can still pick another editor (e.g. CodeMirror) under Content editor in their profile; Expert mode always uses the code editor.'
              default: 1
              options: { 1: Enabled, 0: Disabled }
            theme:
              type: select
              label: Editor appearance
              default: auto
              options: { auto: Follow system, light: Light, dark: Dark }
            smart_typography:
              type: toggle
              label: Smart typography
              default: 1
              options: { 1: Enabled, 0: Disabled }
            shortcode_previews:
              type: toggle
              label: Shortcode previews
              help: Renders shortcode blocks through shortcode-core on demand. Raw HTML and Twig are never executed.
              default: 1
              options: { 1: Enabled, 0: Disabled }
            page_background:
              type: toggle
              label: Page background color
              help: Background color or gradient of a page, set with the ✦ button of the editor toolbar; the page is painted with it on the site, with readable text.
              default: 1
              options: { 1: Enabled, 0: Disabled }
            page_effects:
              type: toggle
              label: Page effects (snow, stars, sparkles)
              help: Snow, stars or sparkles over a page, set with the ✦ button of the editor toolbar. CSS only; still for visitors who prefer reduced motion.
              default: 1
              options: { 1: Enabled, 0: Disabled }
            plain_tables:
              type: toggle
              label: Tables without background or borders
              help: Applies to every table on the site. A single table can still be set otherwise from the editor (table bar → Table style).
              default: 0
              options: { 1: Enabled, 0: Disabled }
            frontend_alerts:
              type: toggle
              label: GitHub alert styles on public pages
              help: Leave off if the Github Markdown Alerts plugin already styles them.
              default: 0
              options: { 1: Enabled, 0: Disabled }
            toolbar:
              type: checkboxes
              label: Toolbar buttons
              help: Untick the buttons you do not want. Keyboard shortcuts (Ctrl+B, Ctrl+I…) keep working.
              use: keys
              default:
                undo: true
                redo: true
                heading: true
                bold: true
                italic: true
                strike: true
                link: true
                more: true
                bulletList: true
                orderedList: true
                blockquote: true
                alert: true
                codeBlock: true
                raw: true
                shortcode: true
                source: true
                table: true
                alignLeft: true
                alignCenter: true
                alignRight: true
                image: true
                colorBlock: true
                pageSettings: true
              options:
                undo: '↶ Undo'
                redo: '↷ Redo'
                heading: 'H — Heading and paragraph'
                bold: 'B — Bold'
                italic: 'I — Italic'
                strike: 'S — Strikethrough'
                link: '🔗 Link'
                more: '⋯ More formatting (highlight, subscript, superscript, keyboard, citation, abbreviation)'
                bulletList: '•≡ Bulleted list'
                orderedList: '1.≡ Numbered list'
                blockquote: '❝ Blockquote'
                alert: 'ⓘ GitHub-style alert'
                codeBlock: '{ } Code block'
                raw: '</> HTML or Twig block'
                shortcode: '[ ] Shortcode'
                source: '⌘ Markdown source'
                table: '⊞ Table'
                alignLeft: '⇤ Align left'
                alignCenter: '↔ Center'
                alignRight: '⇥ Align right'
                image: '▧ Image (page media, upload, resize)'
                colorBlock: '▣ Colored block (color or gradient)'
                pageSettings: '✦ Page background and effects (also needs one of the page options above)'
